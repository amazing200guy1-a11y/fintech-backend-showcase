name: Security Audit & Automated CVE Guard

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at 04:00 UTC to catch newly disclosed CVEs automatically
    - cron: '0 4 * * 1'

jobs:
  backend-security-audit:
    name: Backend Dependency & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit -r mehd-ai/backend/requirements.txt

      - name: Run pip-audit CVE Scan
        run: |
          cd mehd-ai/backend
          python -m pip_audit -r requirements.txt

  flutter-security-audit:
    name: Flutter Dependency & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mehd_ai_flutter
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd mehd_ai_flutter
          flutter analyze
