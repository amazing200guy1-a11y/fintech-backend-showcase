[package]
name = "mehd_rust_order_router"
version = "1.0.0"
edition = "2021"
authors = ["Usman"]
description = "High-Throughput Lock-Free Order Router & Risk Gateway for Institutional Quant Trading"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "mehd_rust_order_router"
crate-type = ["cdylib", "rlib"]
